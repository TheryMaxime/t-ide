[package]
name = "t-ide"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "T-ide desktop backend: agent engine, storage, and local network server"
license = "MIT"

[lib]
name = "t_ide"
path = "src/lib.rs"

[[bin]]
name = "t-ide"
path = "src/main.rs"

[features]
# The Tauri shell and the OS keychain need platform toolkits (WebKitGTK, DBus/
# Secret Service) that are not available in every environment, so both are
# opt-in. `cargo test` builds the headless core only.
default = []
desktop = ["dep:tauri", "dep:tauri-build"]
os-keychain = ["dep:keyring"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }
mdns-sd = "0.21"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", optional = true }
